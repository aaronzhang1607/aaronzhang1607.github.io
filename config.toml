baseURL = "https://aaronzhang1607.github.io"
locale = "en-us"
title = "Yajie Zhang website"
theme = "researcher"
enableEmoji = true

disableKinds = ["taxonomy", "term"]

[params]
    lang = "en"
    author = "Yajie Zhang"
    description = "Research Assistant @ WangLab (CIBR) · Hibernation"
    favicon = "favicon.ico"
    [params.style]  # appearance options
        fontFamily = "Inconsolata, ui-monospace, Consolas, monospace"
        fontSize = "17px"
        sansStack = "-apple-system, system-ui, Arial, sans-serif"
        pageWidth = "750px"
        avatarSize = "105px"
        colorBlack = "#222222"
        colorRed = "#1a4d8f"  # muted academic blue used for links, numbers, menu
    [[params.socialIcons]]
        icon = "orcid"
        title = "ORCID"
        url = "https://orcid.org/0009-0009-1476-0821"
    [[params.socialIcons]]
        icon = "google-scholar"
        title = "Google Scholar"
        url = "https://scholar.google.com/citations?user=Ag6g7RYAAAAJ"
    [[params.socialIcons]]
        icon = "github"
        title = "GitHub"
        url = "https://github.com/aaronzhang1607"

[menu]
    [[menu.main]]
        name = "About"
        url = "/"
        weight = 1
    [[menu.main]]
        name = "Posts"
        url = "/post/"
        weight = 2

[markup.goldmark.renderer]
    unsafe = true  # allow raw HTML in markdown files
